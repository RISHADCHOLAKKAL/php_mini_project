<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Canteen | Home</title>
  <style>
    :root {
      --bg: #cfdacf;
      --card-bg: #f9faf8;
      --primary-pill: #5b795d;
      --pill-hover: #4e6950;
      --accent-pill: #8fa791;
      --table-bg: #bcd0be;
      --table-hover: #a8bca9;
      --text-dark: #1f2b1f;
      --white: #ffffff;
      --shadow: rgba(31, 43, 31, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #eef3ee 0%, #cfdacf 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 380px;
      padding: 28px 22px;
      border-radius: 30px;
      box-shadow: 0 15px 35px var(--shadow);
      text-align: center;
    }

    /* Header title */
    .header {
      margin-bottom: 20px;
    }

    .header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .header p {
      font-size: 13px;
      color: #6b7a6b;
      margin-top: 2px;
    }

    /* Action Pill Buttons */
    .btn-full {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--white);
      background-color: var(--primary-pill);
      box-shadow: 0 4px 12px rgba(91, 121, 93, 0.25);
      transition: all 0.25s ease;
    }

    .btn-full.secondary {
      background-color: var(--accent-pill);
      box-shadow: 0 4px 12px rgba(143, 167, 145, 0.25);
    }

    .btn-full:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(91, 121, 93, 0.35);
    }

    .btn-full:active {
      transform: translateY(0);
    }

    /* Grid for Tables */
    .table-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .table-card {
      background-color: var(--table-bg);
      color: var(--text-dark);
      border: #0e630e solid 1px;
      border-radius: 22px;
      padding: 28px 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      transition: all 0.25s ease;
    }

    .table-card:hover {
      background-color: var(--table-hover);
      color: var(--white);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(91, 121, 93, 0.25);
    }

    .table-icon {
      width: 32px;
      height: 32px;
      fill: currentColor;
      opacity: 0.85;
    }

    /* Small badge for status */
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4caf50;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="header">
      <h2>Welcome To Online Kanjipura</h2>
      <p>Select an option or table to begin</p>
    </div>

    <!-- Available Items Pill -->
    <button class="btn-full" onclick="alert('Viewing available items')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.35V22h2.1v-8.65C10.54 12.9 12 11.12 12 9V2h-1v7zm8-7h-2c-1.1 0-2 .9-2 2v6c0 1.66 1.34 3 3 3v8h2V2z" />
      </svg>
      Available Items
    </button>

    <!-- Open Order Pill -->
    <button class="btn-full secondary" onclick="alert('Viewing open orders')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z" />
      </svg>
      Open Order
    </button>

    <!-- Table Grid -->
    <div class="table-grid">
      <button class="table-card" onclick="alert('Table 1 selected')">
        <svg class="table-icon" viewBox="0 0 24 24">
          <path d="M4 18h16v2H4zm1-4h14l1-6H4zm0-8h14v2H5z" />
        </svg>
        <span>Table 1</span>
      </button>

      <button class="table-card" onclick="alert('Table 2 selected')">
        <svg class="table-icon" viewBox="0 0 24 24">
          <path d="M4 18h16v2H4zm1-4h14l1-6H4zm0-8h14v2H5z" />
        </svg>
        <span>Table 2</span>
      </button>

      <button class="table-card" onclick="alert('Table 3 selected')">
        <svg class="table-icon" viewBox="0 0 24 24">
          <path d="M4 18h16v2H4zm1-4h14l1-6H4zm0-8h14v2H5z" />
        </svg>
        <span>Table 3</span>
      </button>

      <button class="table-card" onclick="alert('Table 4 selected')">
        <svg class="table-icon" viewBox="0 0 24 24">
          <path d="M4 18h16v2H4zm1-4h14l1-6H4zm0-8h14v2H5z" />
        </svg>
        <span>Table 4</span>
      </button>

      <button class="table-card" onclick="alert('Table 5 selected')">
        <svg class="table-icon" viewBox="0 0 24 24">
          <path d="M4 18h16v2H4zm1-4h14l1-6H4zm0-8h14v2H5z" />
        </svg>
        <span>Table 5</span>
      </button>

      <button class="table-card" onclick="alert('Table 6 selected')">
        <svg class="table-icon" viewBox="0 0 24 24">
          <path d="M4 18h16v2H4zm1-4h14l1-6H4zm0-8h14v2H5z" />
        </svg>
        <span>Table 6</span>
      </button>
    </div>
  </div>

</body>

</html>
