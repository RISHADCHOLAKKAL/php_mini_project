<!DOCTYPE html>
<!-- ╔═══════════════════════════════════════════════════════════════╗
     ║           test.html — Testing Portal & Directory            ║
     ║                                                              ║
     ║  PURPOSE: A developer tool page that lists ALL pages in      ║
     ║  the e-canteen app. Useful for quick testing — click any     ║
     ║  link to jump to that page directly.                        ║
     ║                                                              ║
     ║  NOTE: This page is NOT part of the user-facing app.         ║
     ║  It's a helper for developers / testers.                     ║
     ╚═══════════════════════════════════════════════════════════════╝ -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Canteen | Testing Portal & Directory</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Page-specific styles -->
  <style>
    /* ── List of page links ── */
    .page-list {
      display: flex;
      flex-direction: column;     /* stack links vertically */
      gap: 10px;
      margin-top: 15px;
      width: 100%;
    }

    /* ── Page Link Button ──
       Each link is styled as a card-like button */
    .page-link-btn {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #0e630e;
      border-radius: 18px;
      background-color: var(--item-bg);
      color: var(--text-dark);
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;         /* remove default link underline */
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      transition: all 0.25s ease;    /* smooth hover animation */
    }

    /* Hover effect — button turns green and lifts up */
    .page-link-btn:hover {
      background-color: var(--primary-pill);
      color: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(91, 121, 93, 0.3);
    }

    /* ── Small Badge showing the filename ── */
    .badge-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      background-color: var(--card-bg);
      color: var(--text-dark);
    }

    /* Badge turns semi-transparent white on hover (matches green bg) */
    .page-link-btn:hover .badge-tag {
      background-color: rgba(255, 255, 255, 0.2);
      color: var(--white);
    }
  </style>
</head>

<body>

  <!-- ═══════════════════════════════════════════════════════════
       THE MAIN CARD — List of all app pages
       ═══════════════════════════════════════════════════════════ -->
  <div class="card">

    <!-- Page header -->
    <div class="header">
      <h2>E-Canteen Test Hub</h2>
      <p>Testing Directory for GitHub Pages</p>
    </div>

    <!-- ── PAGE LINKS ──
         Each link takes you to a different page in the app.
         The badge on the right shows the actual filename. -->
    <div class="page-list">

      <!-- 1. Login / Sign Up Page -->
      <a href="index.html" class="page-link-btn">
        <span>🔐 Login / Sign Up Page</span>
        <span class="badge-tag">index.html</span>
      </a>

      <!-- 2. User Home Screen -->
      <a href="home.html" class="page-link-btn">
        <span>🏠 User Home Screen</span>
        <span class="badge-tag">home.html</span>
      </a>

      <!-- 3. Available Items Menu -->
      <a href="menu.html" class="page-link-btn">
        <span>🥗 Available Items Menu</span>
        <span class="badge-tag">menu.html</span>
      </a>

      <!-- 4. Open Order / Checkout Page -->
      <a href="open-order.html" class="page-link-btn">
        <span>🛒 Open Order Checkout</span>
        <span class="badge-tag">open-order.html</span>
      </a>

      <!-- 5. Admin Dashboard -->
      <a href="admin-home.html" class="page-link-btn">
        <span>🛠️ Admin Dashboard</span>
        <span class="badge-tag">admin-home.html</span>
      </a>

      <!-- 6. Staff Stock Manager -->
      <a href="staff.html" class="page-link-btn">
        <span>📦 Staff Stock Manager</span>
        <span class="badge-tag">staff.html</span>
      </a>

      <!-- 7. Admin Sales Report -->
      <a href="sales-report.html" class="page-link-btn">
        <span>📊 Admin Sales Report</span>
        <span class="badge-tag">sales-report.html</span>
      </a>
    </div>
  </div>

</body>

</html>
