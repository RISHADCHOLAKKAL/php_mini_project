<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Kanjipura</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .role-box {
      display: flex;
      background-color: #d9e3d9;
      border-radius: 20px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .role-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 16px;
      background: transparent;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      color: var(--text-muted);
      transition: 0.2s;
    }

    .role-btn.active {
      background-color: var(--primary-pill);
      color: var(--white);
    }

    .footer {
      margin-top: 15px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--text-dark);
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Online Kanjipura</h2>
    <p id="subTitle">Take the first step</p>

    <div class="role-box">
      <button class="role-btn" id="guestBtn" onclick="setRole('guest')">Guest</button>
      <button class="role-btn active" id="studentBtn" onclick="setRole('student')">Student</button>
      <button class="role-btn" id="adminBtn" onclick="setRole('admin')">Admin</button>
    </div>

    <form onsubmit="event.preventDefault(); handleAuthSubmit();">
      <div id="guestInputs" style="display: none;">
        <input type="text" id="guestNameInput" placeholder="Enter your name">
      </div>

      <div id="studentInputs">
        <input type="email" class="student-field" placeholder="E-mail" required>
        <input type="text" class="student-field" placeholder="Username" required>
        <input type="password" class="student-field" placeholder="Password" required>
        <input type="password" class="student-field" placeholder="Confirm password" required>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Sign up</button>
    </form>

    <div class="footer" id="footerBox">
      Already have an account? <a onclick="alert('Switching form...')">Sign in</a>
    </div>
  </div>

  <script>
    let currentRole = 'student';

    function setRole(role) {
      currentRole = role;
      const guestInputs = document.getElementById('guestInputs');
      const studentInputs = document.getElementById('studentInputs');
      const guestNameInput = document.getElementById('guestNameInput');
      const studentFields = document.querySelectorAll('.student-field');
      const submitBtn = document.getElementById('submitBtn');
      const guestBtn = document.getElementById('guestBtn');
      const studentBtn = document.getElementById('studentBtn');
      const adminBtn = document.getElementById('adminBtn');
      const footerBox = document.getElementById('footerBox');
      const subTitle = document.getElementById('subTitle');

      guestBtn.className = 'role-btn' + (role === 'guest' ? ' active' : '');
      studentBtn.className = 'role-btn' + (role === 'student' ? ' active' : '');
      adminBtn.className = 'role-btn' + (role === 'admin' ? ' active' : '');

      if (role === 'guest') {
        guestInputs.style.display = 'block';
        studentInputs.style.display = 'none';
        footerBox.style.display = 'none';

        guestNameInput.required = true;
        studentFields.forEach(field => field.required = false);

        submitBtn.textContent = 'Enter Website';
        subTitle.textContent = 'Explore as Guest';
      } else if (role === 'admin') {
        guestInputs.style.display = 'none';
        studentInputs.style.display = 'block';
        footerBox.style.display = 'none';

        guestNameInput.required = false;
        studentFields.forEach(field => field.required = true);

        submitBtn.textContent = 'Admin Sign In';
        subTitle.textContent = 'Admin Portal Access';
      } else {
        guestInputs.style.display = 'none';
        studentInputs.style.display = 'block';
        footerBox.style.display = 'block';

        guestNameInput.required = false;
        studentFields.forEach(field => field.required = true);

        submitBtn.textContent = 'Sign up';
        subTitle.textContent = 'Take the first step';
      }
    }

    function handleAuthSubmit() {
      if (currentRole === 'admin') {
        window.location.href = 'admin-home.html';
      } else {
        window.location.href = 'home.html';
      }
    }
  </script>

</body>

</html>
