<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Kanjipura</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .role-box {
      display: flex;
      background-color: #d9e3d9;
      border-radius: 20px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .role-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 16px;
      background: transparent;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      color: var(--text-muted);
      transition: 0.2s;
    }

    .role-btn.active {
      background-color: var(--primary-pill);
      color: var(--white);
    }

    .footer {
      margin-top: 15px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--text-dark);
      font-weight: bold;
      text-decoration: underline;
    }

    #msg {
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      display: none;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Online Kanjipura</h2>
    <p id="sub">Take the first step</p>

    <div class="role-box">
      <button class="role-btn" id="gBtn" onclick="setRole('guest')">Guest</button>
      <button class="role-btn active" id="sBtn" onclick="setRole('student')">Student</button>
      <button class="role-btn" id="aBtn" onclick="setRole('admin')">Admin</button>
    </div>

    <div id="msg"></div>

    <!-- Guest -->
    <div id="gP" style="display:none"><input type="text" id="gName" placeholder="Enter your name"></div>
    <!-- Student signup -->
    <div id="sP">
      <input type="email" id="sEmail" placeholder="E-mail">
      <input type="text" id="sUser" placeholder="Username">
      <input type="password" id="sPass" placeholder="Password">
      <input type="password" id="sPass2" placeholder="Confirm password">
    </div>
    <!-- Admin login -->
    <div id="aP" style="display:none">
      <input type="text" id="aUser" placeholder="Admin Username">
      <input type="password" id="aPass" placeholder="Admin Password">
    </div>

    <button class="submit-btn" id="btn" onclick="submit()">Sign up</button>
    <div class="footer" id="ft">Already have an account? <a href="signin.html">Sign in</a></div>
  </div>

  <script>
    var role = 'student';
    function show(id) { document.getElementById(id).style.display = 'block'; }
    function hide(id) { document.getElementById(id).style.display = 'none'; }
    function showMsg(t, err) { var m = document.getElementById('msg'); m.textContent = t; m.style.display = 'block'; m.style.background = err ? '#ffebee' : '#e8f5e9'; m.style.color = err ? '#c62828' : '#2e7d32'; }

    function setRole(r) {
      role = r;
      document.getElementById('gBtn').className = 'role-btn' + (r === 'guest' ? ' active' : '');
      document.getElementById('sBtn').className = 'role-btn' + (r === 'student' ? ' active' : '');
      document.getElementById('aBtn').className = 'role-btn' + (r === 'admin' ? ' active' : '');
      hide('gP'); hide('sP'); hide('aP'); hide('msg');
      if (r === 'guest') { show('gP'); hide('ft'); document.getElementById('btn').textContent = 'Enter Website'; document.getElementById('sub').textContent = 'Explore as Guest'; }
      if (r === 'student') { show('sP'); show('ft'); document.getElementById('btn').textContent = 'Sign up'; document.getElementById('sub').textContent = 'Take the first step'; }
      if (r === 'admin') { show('aP'); hide('ft'); document.getElementById('btn').textContent = 'Admin Sign In'; document.getElementById('sub').textContent = 'Admin Portal'; }
    }

    function post(data, cb) {
      var x = new XMLHttpRequest();
      x.open('POST', 'api.php', true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.onload = function () { try { cb(JSON.parse(x.responseText)); } catch (e) { showMsg('Server error: ' + x.responseText.substring(0, 80), true); } };
      x.onerror = function () { showMsg('Network error', true); };
      x.send(JSON.stringify(data));
    }

    function submit() {
      var btn = document.getElementById('btn');
      hide('msg');

      if (role === 'guest') { window.location.href = 'home.html'; return; }

      if (role === 'student') {
        var p = document.getElementById('sPass').value, p2 = document.getElementById('sPass2').value;
        if (p.length < 4) { showMsg('Password must be at least 4 characters', true); return; }
        if (p !== p2) { showMsg('Passwords do not match', true); return; }
        btn.disabled = true; btn.textContent = 'Creating account...';
        post({ action: 'signup', email: document.getElementById('sEmail').value.trim(), username: document.getElementById('sUser').value.trim(), password: p, role: 'student' }, function (res) {
          btn.disabled = false; btn.textContent = 'Sign up';
          if (res.error) { showMsg(res.error, true); return; }
          showMsg('Account created!', false);
          setTimeout(function () { window.location.href = 'home.html'; }, 800);
        });
      }

      if (role === 'admin') {
        btn.disabled = true; btn.textContent = 'Signing in...';
        post({ action: 'login', username: document.getElementById('aUser').value.trim(), password: document.getElementById('aPass').value }, function (res) {
          btn.disabled = false; btn.textContent = 'Admin Sign In';
          if (res.error) { showMsg(res.error, true); return; }
          if (res.role !== 'admin') { showMsg('This account is not an admin', true); return; }
          showMsg('Welcome, Admin!', false);
          setTimeout(function () { window.location.href = 'admin-home.html'; }, 800);
        });
      }
    }
  </script>
</body>

</html>
