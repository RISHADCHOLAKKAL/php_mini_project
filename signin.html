<!DOCTYPE html>
<!-- ╔═══════════════════════════════════════════════════════════════╗
     ║              signin.html — Sign In Page                     ║
     ║                                                              ║
     ║  PURPOSE: Login page for existing users (students & admins). ║
     ║  Users enter their username and password to log in.          ║
     ║                                                              ║
     ║  AFTER LOGIN:                                                ║
     ║    Students → redirected to home.html                        ║
     ║    Admins   → redirected to admin-home.html                  ║
     ╚═══════════════════════════════════════════════════════════════╝ -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Canteen | Sign In</title>

  <!-- Link to global styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Page-specific styles -->
  <style>
    /* Footer text with link to sign-up page */
    .footer {
      margin-top: 15px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--text-dark);
      font-weight: bold;
      text-decoration: underline;
    }

    /* Message box — hidden by default, shown by JavaScript */
    #msg {
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      display: none;       /* hidden until showMsg() is called */
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════
       THE MAIN CARD — Login Form
       ═══════════════════════════════════════════════════════════ -->
  <div class="card">

    <!-- Page header with title and subtitle -->
    <div class="header">
      <h2>Online Kanjipura</h2>
      <p>Welcome back</p>
    </div>

    <!-- Message box for success/error feedback -->
    <div id="msg"></div>

    <!-- ── LOGIN FORM ──
         The form uses onsubmit instead of a button onclick.
         This lets the user press Enter to submit.
         e.preventDefault() stops the form from reloading the page. -->
    <form id="loginForm">
      <input type="text" id="user" placeholder="Username" required>
      <input type="password" id="pass" placeholder="Password" required>
      <button type="submit" class="submit-btn" id="btn">Sign in</button>
    </form>

    <!-- Link to sign-up page for new users -->
    <div class="footer">
      Don't have an account? <a href="index.html">Sign up</a>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════════════
       JAVASCRIPT — Login Logic
       ═══════════════════════════════════════════════════════════ -->
  <script>

    // ── FUNCTION: Show a Message ──
    // Displays a success (green) or error (red) message
    function showMsg(text, isError) {
      var messageBox = document.getElementById('msg');
      messageBox.textContent = text;                                         // set the text
      messageBox.style.display = 'block';                                    // make visible
      messageBox.style.background = isError ? '#ffebee' : '#e8f5e9';        // red or green bg
      messageBox.style.color = isError ? '#c62828' : '#2e7d32';             // red or green text
    }


    // ── FORM SUBMIT HANDLER ──
    // This runs when the user clicks "Sign in" or presses Enter
    document.getElementById('loginForm').onsubmit = function(event) {

      // Prevent the form from doing its default action (reloading the page)
      event.preventDefault();

      // Get reference to the submit button (to disable it during loading)
      var btn = document.getElementById('btn');
      btn.disabled = true;                          // disable button so user can't click twice
      btn.textContent = 'Signing in...';            // show loading text

      // ── Prepare the data to send to api.php ──
      // JSON.stringify() converts a JavaScript object into a JSON text string
      var requestBody = JSON.stringify({
        action:   'login',                                             // tell api.php we want to login
        username: document.getElementById('user').value.trim(),        // get the username (trimmed)
        password: document.getElementById('pass').value                // get the password
      });

      // ── Send the login request using XMLHttpRequest ──
      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'api.php', true);                               // POST to api.php, async
      xhr.setRequestHeader('Content-Type', 'application/json');        // we're sending JSON

      // ── Handle the server's response ──
      xhr.onload = function() {
        // Re-enable the button
        btn.disabled = false;
        btn.textContent = 'Sign in';

        // Try to parse the JSON response
        try {
          var response = JSON.parse(xhr.responseText);
        } catch(parseError) {
          // If the response isn't valid JSON, show a raw error
          showMsg('Server error: ' + xhr.responseText.substring(0, 100), true);
          return;   // stop here
        }

        // Check if the server returned an error
        if (response.error) {
          showMsg(response.error, true);       // show the error message
          return;
        }

        // ── Login successful! ──
        showMsg('Welcome back, ' + response.username + '!', false);

        // Redirect after 0.8 seconds (so the user sees the welcome message)
        // If role is "admin" → go to admin dashboard
        // Otherwise → go to the student home page
        setTimeout(function() {
          if (response.role === 'admin') {
            window.location.href = 'admin-home.html';
          } else {
            window.location.href = 'home.html';
          }
        }, 800);
      };

      // ── Handle network errors ──
      xhr.onerror = function() {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        showMsg('Network error - check if XAMPP is running', true);
      };

      // Send the request with the JSON body
      xhr.send(requestBody);
    };
  </script>

</body>
</html>
