<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Canteen | Staff Panel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .staff-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .edit-card {
      background-color: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .edit-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .edit-input {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #a8bca9;
      background-color: var(--white);
      font-size: 13px;
      margin-bottom: 0;
    }

    .edit-name {
      flex: 2;
      font-weight: bold;
    }

    .edit-price {
      width: 70px;
      font-weight: bold;
    }

    .edit-qty {
      width: 70px;
    }

    .status-toggle {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .status-toggle.on {
      background-color: #e8f5e9;
      color: var(--available);
    }

    .status-toggle.off {
      background-color: #ffebee;
      color: var(--unavailable);
    }

    .save-btn {
      background-color: var(--primary-pill);
      color: var(--white);
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-new-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-pill);
      color: var(--white);
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Modal Form Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 360px;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal-card h3 {
      font-size: 18px;
      color: var(--text-dark);
      margin-bottom: 12px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .cancel-btn {
      flex: 1;
      padding: 10px;
      background-color: #d9e3d9;
      color: var(--text-dark);
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="card card-full">
    <div class="header">
      <button class="back-btn" onclick="window.location.href='admin-home.html'" title="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </button>
      <h2>Staff Manage Items</h2>
      <p>Edit item price, quantity & availability</p>
    </div>

    <!-- Add New Item Button -->
    <button class="add-new-btn" onclick="openAddModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
      Add New Item
    </button>

    <!-- Editable Items List -->
    <div class="staff-list" id="staffList"></div>
  </div>

  <!-- Modal for Adding New Item -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <h3>Add New Item</h3>
      <input type="text" id="newItemName" placeholder="Item Name" required>
      <input type="text" id="newItemDesc" placeholder="Description (e.g. Fresh & Spicy)">
      <input type="number" id="newItemPrice" placeholder="Price (₹)" required>
      <input type="number" id="newItemQty" placeholder="Initial Quantity" required>
      <select id="newItemCategory" style="width: 100%; padding: 12px; border-radius: 14px; border: none; background: #d9e3d9; font-weight: bold; margin-bottom: 12px;">
        <option value="food">Food</option>
        <option value="beverage">Beverage</option>
        <option value="snacks">Snacks</option>
      </select>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeAddModal()">Cancel</button>
        <button class="save-btn" style="flex: 1;" onclick="addNewItem()">Add Item</button>
      </div>
    </div>
  </div>

  <script src="store.js"></script>
  <script>
    function renderStaffItems() {
      const items = getMenuItems();
      const container = document.getElementById('staffList');
      container.innerHTML = '';

      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'edit-card';
        card.innerHTML = `
          <div class="edit-row">
            <input type="text" class="edit-input edit-name" value="${item.name}" id="name-${index}">
            <input type="number" class="edit-input edit-price" value="${item.price}" id="price-${index}" placeholder="Price">
          </div>
          <div class="edit-row">
            <input type="number" class="edit-input edit-qty" value="${item.qty}" id="qty-${index}" placeholder="Qty">
            <button class="status-toggle ${item.isAvailable && item.qty > 0 ? 'on' : 'off'}" id="status-${index}" onclick="toggleStatus(${index})">
              ${item.isAvailable && item.qty > 0 ? 'Available' : 'Sold Out'}
            </button>
            <button class="save-btn" onclick="saveSingleItem(${index})">Save</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openAddModal() {
      document.getElementById('addModal').style.display = 'flex';
    }

    function closeAddModal() {
      document.getElementById('addModal').style.display = 'none';
    }

    function addNewItem() {
      const name = document.getElementById('newItemName').value.trim();
      const desc = document.getElementById('newItemDesc').value.trim() || 'Delicious canteen item';
      const price = parseInt(document.getElementById('newItemPrice').value) || 0;
      const qty = parseInt(document.getElementById('newItemQty').value) || 0;
      const category = document.getElementById('newItemCategory').value;

      if (!name || price <= 0 || qty < 0) {
        alert('Please fill out item name, valid price, and quantity!');
        return;
      }

      const items = getMenuItems();
      const newItem = {
        id: Date.now(),
        name,
        desc,
        price,
        category,
        qty,
        isAvailable: qty > 0,
        icon: "M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.35V22h2.1v-8.65C10.54 12.9 12 11.12 12 9V2h-1v7zm8-7h-2c-1.1 0-2 .9-2 2v6c0 1.66 1.34 3 3 3v8h2V2z"
      };

      items.push(newItem);
      saveMenuItems(items);

      closeAddModal();
      alert(`Added ${name} successfully!`);

      // Clear input fields
      document.getElementById('newItemName').value = '';
      document.getElementById('newItemDesc').value = '';
      document.getElementById('newItemPrice').value = '';
      document.getElementById('newItemQty').value = '';

      renderStaffItems();
    }

    function toggleStatus(index) {
      const items = getMenuItems();
      items[index].isAvailable = !items[index].isAvailable;
      if (!items[index].isAvailable) items[index].qty = 0;
      else if (items[index].qty === 0) items[index].qty = 10;
      saveMenuItems(items);
      renderStaffItems();
    }

    function saveSingleItem(index) {
      const items = getMenuItems();
      const newName = document.getElementById(`name-${index}`).value.trim();
      const newPrice = parseInt(document.getElementById(`price-${index}`).value) || 0;
      const newQty = parseInt(document.getElementById(`qty-${index}`).value) || 0;

      if (!newName) {
        alert('Item name cannot be empty!');
        return;
      }

      items[index].name = newName;
      items[index].price = newPrice;
      items[index].qty = newQty;
      items[index].isAvailable = newQty > 0;

      saveMenuItems(items);
      alert(`Updated ${newName} successfully!`);
      renderStaffItems();
    }

    renderStaffItems();
  </script>

</body>

</html>
