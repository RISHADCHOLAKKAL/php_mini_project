<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Report</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .box {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 16px;
      padding: 12px;
    }

    .box .lbl {
      font-size: 11px;
      font-weight: bold;
      color: #384d39;
      text-transform: uppercase;
    }

    .box .val {
      font-size: 20px;
      font-weight: 800;
    }

    .bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      overflow-x: auto;
    }

    .chip {
      background: #d9e3d9;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--primary-pill);
      color: #fff;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .nav button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 8px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .card-item {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card card-full">
    <div class="header">
      <button class="back-btn" onclick="location.href='admin-home.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </button>
      <h2>Sales Report</h2>
      <p id="pLabel">Overview</p>
    </div>

    <div class="grid">
      <div class="box">
        <div class="lbl">Revenue</div>
        <div class="val" id="rev">₹0</div>
      </div>
      <div class="box">
        <div class="lbl">Orders</div>
        <div class="val" id="cnt">0</div>
      </div>
    </div>

    <div class="bar" id="pBar">
      <button class="chip active" onclick="setP('daily',this)">Daily</button>
      <button class="chip" onclick="setP('weekly',this)">Weekly</button>
      <button class="chip" onclick="setP('monthly',this)">Monthly</button>
      <button class="chip" onclick="setP('yearly',this)">Yearly</button>
      <button class="chip" onclick="setP('all',this)">All Time</button>
    </div>

    <div class="nav" id="dNav">
      <button onclick="shift(-1)">◀</button>
      <span id="dLbl">Today</span>
      <button onclick="shift(1)">▶</button>
    </div>

    <div class="bar">
      <button class="chip active" onclick="setT('all',this)">All</button>
      <button class="chip" onclick="setT('tables',this)">Tables</button>
      <button class="chip" onclick="setT('open',this)">Open Orders</button>
    </div>

    <div class="list" id="salesList"></div>
  </div>

  <script src="store.js"></script>
  <script>
    var allSales = [], period = 'daily', type = 'all', offset = 0;

    function getRange() {
      var n = new Date(), s, e, l;
      if (period === 'daily') {
        s = new Date(n.getFullYear(), n.getMonth(), n.getDate() + offset);
        e = new Date(s); e.setDate(e.getDate() + 1);
        l = offset === 0 ? 'Today' : (offset === -1 ? 'Yesterday' : s.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
      } else if (period === 'weekly') {
        var day = n.getDay() || 7;
        s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - day + 1 + (offset * 7));
        e = new Date(s); e.setDate(e.getDate() + 7);
        l = s.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ' – ' + new Date(e - 864e5).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
      } else if (period === 'monthly') {
        s = new Date(n.getFullYear(), n.getMonth() + offset, 1);
        e = new Date(n.getFullYear(), n.getMonth() + offset + 1, 1);
        l = s.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
      } else if (period === 'yearly') {
        s = new Date(n.getFullYear() + offset, 0, 1);
        e = new Date(n.getFullYear() + offset + 1, 0, 1);
        l = s.getFullYear().toString();
      } else {
        s = new Date(0); e = new Date(9e11); l = 'All Time';
      }
      return { s: s, e: e, l: l };
    }

    function render() {
      var r = getRange();
      document.getElementById('dLbl').textContent = r.l;
      document.getElementById('dNav').style.display = period === 'all' ? 'none' : 'flex';
      document.getElementById('pLabel').textContent = r.l + ' overview';

      var list = allSales.filter(function (o) {
        var d = new Date(o.date);
        return d >= r.s && d < r.e;
      });

      if (type === 'tables') list = list.filter(function (o) { return o.table; });
      if (type === 'open') list = list.filter(function (o) { return !o.table; });

      var rev = 0;
      list.forEach(function (o) { rev += parseInt(o.total) || 0; });
      document.getElementById('rev').textContent = '₹' + rev;
      document.getElementById('cnt').textContent = list.length;

      var container = document.getElementById('salesList');
      container.innerHTML = list.length ? '' : '<div style="text-align:center;padding:20px;color:var(--text-muted);">No orders found</div>';

      list.forEach(function (o) {
        var items = o.items.map(function (i) { return i.name + ' x' + i.qty; }).join(', ');
        var el = document.createElement('div');
        el.className = 'card-item';
        el.innerHTML =
          '<div class="row"><span>' + o.order_code + '</span><span>' + o.type + '</span></div>' +
          '<div style="font-size:12px;color:var(--text-muted);">' + items + '</div>' +
          '<div class="row" style="margin-top:4px;"><span>' + (new Date(o.date)).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</span><span>₹' + o.total + '</span></div>';
        container.appendChild(el);
      });
    }

    function setP(p, el) { period = p; offset = 0; act(el, '#pBar'); render(); }
    function setT(t, el) { type = t; act(el, el.parentElement); render(); }
    function act(el, parent) { (typeof parent === 'string' ? document.querySelector(parent) : parent).querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); }); el.classList.add('active'); }
    function shift(d) { if (period !== 'all' && (offset + d) <= 0) { offset += d; render(); } }

    getSalesHistory(function (sales) { allSales = sales || []; render(); });
  </script>
</body>

</html>
