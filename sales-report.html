<!DOCTYPE html>
<!-- ╔═══════════════════════════════════════════════════════════════╗
     ║          sales-report.html — Admin Sales Report             ║
     ║                                                              ║
     ║  PURPOSE: Shows sales history for admins with filters.       ║
     ║                                                              ║
     ║  FEATURES:                                                   ║
     ║    - Revenue & Order Count summary boxes                    ║
     ║    - Period filters: Daily, Weekly, Monthly, Yearly, All    ║
     ║    - Navigate between dates (← →)                          ║
     ║    - Scrollable list of individual orders                   ║
     ║                                                              ║
     ║  DATA SOURCE: store.js → api.php?action=sales               ║
     ╚═══════════════════════════════════════════════════════════════╝ -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Report</title>

  <!-- Global styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Page-specific styles -->
  <style>
    /* ── Summary Grid (Revenue + Orders boxes) ──
       Two boxes side by side at the top of the page */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;    /* two equal-width columns */
      gap: 10px;
      margin-bottom: 12px;
    }

    /* ── Summary Box ── */
    .box {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 16px;
      padding: 12px;
    }

    /* Label text inside box (e.g., "REVENUE") */
    .box .lbl {
      font-size: 11px;
      font-weight: bold;
      color: #384d39;
      text-transform: uppercase;     /* makes text ALL CAPS */
    }

    /* Value text inside box (e.g., "₹1,200") */
    .box .val {
      font-size: 20px;
      font-weight: 800;
    }

    /* ── Filter Chip Bar ── */
    .bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      overflow-x: auto;
    }

    /* ── Filter Chip Button ── */
    .chip {
      background: #d9e3d9;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Active chip — green background */
    .chip.active {
      background: var(--primary-pill);
      color: #fff;
    }

    /* ── Date Navigation Bar (◀ Today ▶) ── */
    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    /* Navigation arrow buttons */
    .nav button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 8px;
    }

    /* ── Scrollable Sales List ── */
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    /* ── Individual Order Card ── */
    .card-item {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Row inside order card (order code + type, date + total) */
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <!-- ═══════════════════════════════════════════════════════════
       THE MAIN CARD — Full-screen sales report
       ═══════════════════════════════════════════════════════════ -->
  <div class="card card-full">

    <!-- Header with back button -->
    <div class="header">
      <button class="back-btn" onclick="location.href='admin-home.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </button>
      <h2>Sales Report</h2>
      <p id="pLabel">Overview</p>
    </div>

    <!-- ── SUMMARY BOXES: Revenue & Order Count ── -->
    <div class="grid">
      <div class="box">
        <div class="lbl">Revenue</div>
        <div class="val" id="rev">₹0</div>
      </div>
      <div class="box">
        <div class="lbl">Orders</div>
        <div class="val" id="cnt">0</div>
      </div>
    </div>

    <!-- ── PERIOD FILTER (Daily / Weekly / Monthly / Yearly / All Time) ── -->
    <div class="bar" id="pBar">
      <button class="chip active" onclick="setPeriod('daily',this)">Daily</button>
      <button class="chip" onclick="setPeriod('weekly',this)">Weekly</button>
      <button class="chip" onclick="setPeriod('monthly',this)">Monthly</button>
      <button class="chip" onclick="setPeriod('yearly',this)">Yearly</button>
      <button class="chip" onclick="setPeriod('all',this)">All Time</button>
    </div>

    <!-- ── DATE NAVIGATOR (◀ / Today / ▶) ──
         Lets the admin go to previous or next day/week/month/year.
         Hidden when "All Time" is selected. -->
    <div class="nav" id="dNav">
      <button onclick="shiftDate(-1)">◀</button>
      <span id="dLbl">Today</span>
      <button onclick="shiftDate(1)">▶</button>
    </div>



    <!-- ── SALES LIST ──
         Dynamically filled with order cards by JavaScript -->
    <div class="list" id="salesList"></div>
  </div>


  <!-- ═══════════════════════════════════════════════════════════
       JAVASCRIPT — Sales Report Logic
       ═══════════════════════════════════════════════════════════ -->

  <!-- Load API helper functions -->
  <script src="store.js"></script>

  <script>
    // ── STATE VARIABLES ──
    var allSales = [];           // all orders fetched from the server
    var period   = 'daily';      // current period filter: 'daily', 'weekly', 'monthly', 'yearly', 'all'
    var offset   = 0;            // date offset: 0 = today, -1 = yesterday, -2 = day before, etc.


    // ── FUNCTION: Calculate Date Range for Current Period ──
    // Returns an object with:
    //   s = start date (inclusive)
    //   e = end date (exclusive)
    //   l = label text (e.g., "Today", "Aug 2025", "2024")
    //
    // This function is the MOST COMPLEX part of the sales report.
    // It calculates which orders to show based on the period and offset.
    function getRange() {
      var now = new Date();           // current date and time
      var startDate, endDate, label;

      if (period === 'daily') {
        // ── DAILY VIEW ──
        // Show orders for a single day.
        // Start of day = midnight (00:00:00)
        // End of day = midnight of the NEXT day
        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset);
        endDate   = new Date(startDate);
        endDate.setDate(endDate.getDate() + 1);    // add 1 day

        // Generate the label
        if (offset === 0) {
          label = 'Today';
        } else if (offset === -1) {
          label = 'Yesterday';
        } else {
          // Format as "25 Aug"
          label = startDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

      } else if (period === 'weekly') {
        // ── WEEKLY VIEW ──
        // Show orders for a full week (Monday to Sunday).
        var dayOfWeek = now.getDay() || 7;    // getDay() returns 0 for Sunday; || 7 converts it to 7
        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1 + (offset * 7));
        endDate   = new Date(startDate);
        endDate.setDate(endDate.getDate() + 7);     // add 7 days

        // Label: "25 Aug – 31 Aug"
        var lastDay = new Date(endDate - 864e5);     // 864e5 = 86400000ms = 1 day (subtract to get last day of week)
        label = startDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) +
                ' – ' +
                lastDay.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });

      } else if (period === 'monthly') {
        // ── MONTHLY VIEW ──
        // Show orders for an entire month.
        startDate = new Date(now.getFullYear(), now.getMonth() + offset, 1);        // 1st of month
        endDate   = new Date(now.getFullYear(), now.getMonth() + offset + 1, 1);    // 1st of NEXT month

        // Label: "August 2025"
        label = startDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

      } else if (period === 'yearly') {
        // ── YEARLY VIEW ──
        // Show orders for an entire year.
        startDate = new Date(now.getFullYear() + offset, 0, 1);        // Jan 1 of the year
        endDate   = new Date(now.getFullYear() + offset + 1, 0, 1);    // Jan 1 of NEXT year

        // Label: "2025"
        label = startDate.getFullYear().toString();

      } else {
        // ── ALL TIME VIEW ──
        // Show ALL orders ever (no date filtering).
        startDate = new Date(0);             // very old date (Jan 1, 1970)
        endDate   = new Date(9999, 0, 1);    // very far future date (year 9999)
        label     = 'All Time';
      }

      return { s: startDate, e: endDate, l: label };
    }


    // ── FUNCTION: Render the Sales Report ──
    // Filters orders by date and type, calculates totals, and displays results.
    function render() {
      // Get the date range for the current period
      var range = getRange();

      // Update the date label (e.g., "Today", "August 2025")
      document.getElementById('dLbl').textContent = range.l;

      // Hide the date navigator when viewing "All Time"
      document.getElementById('dNav').style.display = (period === 'all') ? 'none' : 'flex';

      // Update the subtitle in the header
      document.getElementById('pLabel').textContent = range.l + ' overview';

      // ── FILTER BY DATE ──
      // Keep only orders that fall within the selected date range
      var filteredOrders = allSales.filter(function (order) {
        var orderDate = new Date(order.date);
        return orderDate >= range.s && orderDate < range.e;
      });



      // ── CALCULATE REVENUE ──
      var totalRevenue = 0;
      filteredOrders.forEach(function (order) {
        totalRevenue += parseInt(order.total) || 0;
      });

      // Update the summary boxes
      document.getElementById('rev').textContent = '₹' + totalRevenue;
      document.getElementById('cnt').textContent = filteredOrders.length;

      // ── RENDER ORDER CARDS ──
      var container = document.getElementById('salesList');

      // If no orders found, show a "No orders found" message
      if (filteredOrders.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">No orders found</div>';
      } else {
        container.innerHTML = '';    // clear existing content
      }

      // Loop through each order and create a card
      filteredOrders.forEach(function (order) {
        // Build a comma-separated string of items
        // Example: "Masala Tea x2, Samosa x1"
        var itemsList = order.items.map(function (item) {
          return item.name + ' x' + item.qty;
        }).join(', ');

        // Create the order card element
        var card = document.createElement('div');
        card.className = 'card-item';

        // Card HTML:
        // Row 1: Order code (left) + Order type (right)
        // Row 2: Items list
        // Row 3: Date & time (left) + Total price (right)
        card.innerHTML =
          // ── Row 1: Order Code ──
          '<div class="row">' +
            '<span>' + order.order_code + '</span>' +
            '<span style="color:var(--text-muted);font-size:12px;">Open Order</span>' +
          '</div>' +

          // ── Row 2: Items List ──
          '<div style="font-size:12px;color:var(--text-muted);">' + itemsList + '</div>' +

          // ── Row 3: Date & Total ──
          '<div class="row" style="margin-top:4px;">' +
            '<span>' +
              // Format the date as "25 Aug, 02:30 PM"
              (new Date(order.date)).toLocaleString('en-IN', {
                day: 'numeric',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
              }) +
            '</span>' +
            '<span>₹' + order.total + '</span>' +
          '</div>';

        container.appendChild(card);
      });
    }


    // ── FUNCTION: Set Period Filter ──
    // Called when user clicks Daily / Weekly / Monthly / Yearly / All
    function setPeriod(newPeriod, clickedElement) {
      period = newPeriod;
      offset = 0;                                   // reset offset when changing period
      setActiveChip(clickedElement, '#pBar');        // update active chip styling
      render();                                      // re-render with new filter
    }





    // ── FUNCTION: Update Active Chip Styling ──
    // Removes 'active' class from all chips in a container,
    // then adds it to the clicked chip.
    //
    // Parameters:
    //   clickedElement = the chip button that was clicked
    //   parent         = the parent container (string selector or element)
    function setActiveChip(clickedElement, parent) {
      // If parent is a string (like '#pBar'), find the element
      var parentElement = (typeof parent === 'string')
        ? document.querySelector(parent)
        : parent;

      // Remove 'active' from all chips in this container
      parentElement.querySelectorAll('.chip').forEach(function (chip) {
        chip.classList.remove('active');
      });

      // Add 'active' to the clicked chip
      clickedElement.classList.add('active');
    }


    // ── FUNCTION: Shift Date ──
    // Called when user clicks ◀ (previous) or ▶ (next) arrow.
    //
    // Parameter:
    //   direction = -1 (go back) or +1 (go forward)
    //
    // Note: You can only go backwards (into the past), not into the future.
    // (offset + direction) <= 0 ensures offset never becomes positive.
    function shiftDate(direction) {
      if (period !== 'all' && (offset + direction) <= 0) {
        offset += direction;
        render();
      }
    }


    // ── INITIAL DATA LOAD ──
    // Fetch all sales history from the server, then render the report.
    getSalesHistory(function (sales) {
      allSales = sales || [];
      render();
    });
  </script>
</body>

</html>
