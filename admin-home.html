<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Canteen | Admin Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .logout-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="header">
      <h2>Admin Dashboard</h2>
      <p>Select an option to manage canteen</p>
    </div>

    <!-- Update Stock Pill -->
    <button class="btn-full" onclick="window.location.href='staff.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
      </svg>
      1. Update Stock
    </button>

    <!-- Sales Report Pill -->
    <button class="btn-full secondary" onclick="window.location.href='sales-report.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z" />
        <path d="M5 19h14V5H5v14zm10-6h2v4h-2v-4zm-4-4h2v8h-2V9zm-4 3h2v5H7v-5z"/>
      </svg>
      2. Sales Report
    </button>

    <a href="login.html" class="logout-link">Back to Sign In</a>
  </div>

</body>

</html>
