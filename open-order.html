<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Order</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .item {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 18px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item.off {
      background: #fce8e6;
      border-color: #e57373;
      opacity: 0.7;
    }

    .ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qbtn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: var(--primary-pill);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .qbtn:disabled {
      background: #ccc;
    }

    .foot {
      margin-top: 10px;
      padding: 12px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #d9e3d9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

<body>
  <div class="card card-full">
    <div class="header">
      <button class="back-btn" onclick="location.href='home.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </button>
      <h2>Open Order</h2>
      <p>Select items to order</p>
    </div>

    <div class="list" id="orderList"></div>

    <div class="foot">
      <div>
        <div id="cnt" style="font-size:12px;color:#6b7a6b;font-weight:bold;">0 Items</div>
        <div id="tot" style="font-size:18px;font-weight:800;">Total: ₹0</div>
      </div>
      <button class="submit-btn" style="width:auto;padding:10px 18px;margin:0;" onclick="place()">Place Order</button>
    </div>
  </div>

  <script src="store.js"></script>
  <script>
    var cart = {}, cached = [];

    function render() {
      getMenuItems(function (items) {
        cached = items || [];
        var box = document.getElementById('orderList');
        box.innerHTML = '';
        cached.forEach(function (i) {
          if (!(i.id in cart)) cart[i.id] = 0;
          var sold = !i.isAvailable || i.qty <= 0;
          var div = document.createElement('div');
          div.className = 'item' + (sold ? ' off' : '');
          div.innerHTML = '<div><div style="font-weight:bold;">' + i.name + '</div><div style="font-size:13px;color:#384d39;">' + (sold ? 'Sold Out' : '₹' + i.price) + '</div></div>' +
            '<div class="ctrl">' +
            (sold ? '<button class="qbtn" disabled>+</button>' :
              '<button class="qbtn" onclick="upd(' + i.id + ',-1)">-</button>' +
              '<span style="font-weight:bold;min-width:16px;text-align:center;" id="q-' + i.id + '">' + cart[i.id] + '</span>' +
              '<button class="qbtn" onclick="upd(' + i.id + ',1,' + i.qty + ')">+</button>') +
            '</div>';
          box.appendChild(div);
        });
        calc();
      });
    }

    function upd(id, delta, max) {
      if (delta > 0 && cart[id] >= max) return alert('Stock limit reached');
      cart[id] = Math.max(0, (cart[id] || 0) + delta);
      var el = document.getElementById('q-' + id);
      if (el) el.textContent = cart[id];
      calc();
    }

    function calc() {
      var c = 0, t = 0;
      cached.forEach(function (i) { var q = cart[i.id] || 0; c += q; t += q * i.price; });
      document.getElementById('cnt').textContent = c + ' Items';
      document.getElementById('tot').textContent = 'Total: ₹' + t;
      return t;
    }

    function place() {
      var total = calc(), items = [];
      cached.forEach(function (i) { if (cart[i.id] > 0) items.push({ name: i.name, qty: cart[i.id], price: i.price }); });
      if (!items.length) return alert('Select at least 1 item');
      recordSale({ type: 'Open Order', table: null, total: total, items: items }, function () {
        alert('Order Placed!');
        location.href = 'home.html';
      });
    }

    render();
  </script>
</body>

</html>
